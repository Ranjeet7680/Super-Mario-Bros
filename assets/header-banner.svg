<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="35%" stop-color="#1A153A" />
      <stop offset="70%" stop-color="#3A1738" />
      <stop offset="100%" stop-color="#160826" />
    </linearGradient>

    <linearGradient id="goldOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="50%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="ridgeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6A1B9A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1F0838" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="ridgeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BF360C" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3E1100" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#skyGrad)" stroke="#FF8F00" stroke-width="2" stroke-opacity="0.4" />

  <!-- Stars / Distant Pollen Particles -->
  <g opacity="0.6">
    <circle cx="95" cy="45" r="1.5" fill="#FFF" />
    <circle cx="210" cy="80" r="1" fill="#FFD54F" />
    <circle cx="340" cy="35" r="2" fill="#FFF" />
    <circle cx="510" cy="70" r="1.2" fill="#80D8FF" />
    <circle cx="720" cy="40" r="1.8" fill="#FFF" />
    <circle cx="890" cy="85" r="1.4" fill="#FFD54F" />
    <circle cx="1040" cy="30" r="1.5" fill="#FFF" />
    <circle cx="1130" cy="95" r="2" fill="#80D8FF" />
  </g>

  <!-- Distant Netarhat / Tagore Hill Ridges -->
  <path d="M 0 280 Q 200 190 420 250 T 840 220 T 1200 240 L 1200 420 L 0 420 Z" fill="url(#ridgeGrad1)" />

  <!-- Midground Hills & Water Cascade Silhouette -->
  <path d="M 0 310 Q 180 250 360 290 T 780 270 T 1200 285 L 1200 420 L 0 420 Z" fill="url(#ridgeGrad2)" />

  <!-- Foreground Murram Red Ground Platform -->
  <path d="M 0 360 L 260 360 L 290 380 L 520 380 L 560 350 L 880 350 L 920 375 L 1200 375 L 1200 420 L 0 420 Z" fill="#2E1106" />
  <path d="M 0 360 L 260 360 L 290 380 L 520 380 L 560 350 L 880 350 L 920 375 L 1200 375" stroke="#4CAF50" stroke-width="5" fill="none" />

  <!-- Sohrai Tribal Geometric Border Accent (Top & Bottom) -->
  <g stroke="#FFD54F" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M 40 25 L 50 35 L 60 25 L 70 35 L 80 25 L 90 35 L 100 25 L 110 35 L 120 25 L 130 35 L 140 25 L 150 35 L 160 25 L 170 35 L 180 25 L 190 35 L 200 25" />
    <path d="M 1000 25 L 1010 35 L 1020 25 L 1030 35 L 1040 25 L 1050 35 L 1060 25 L 1070 35 L 1080 25 L 1090 35 L 1100 25 L 1110 35 L 1120 25 L 1130 35 L 1140 25 L 1150 35 L 1160 25" />
  </g>

  <!-- Large Center Glowing Echo Shard -->
  <g transform="translate(600, 105)" filter="url(#shardGlow)">
    <polygon points="0,-48 34,0 0,48 -34,0" fill="url(#cyanGlow)" opacity="0.85" />
    <polygon points="0,-28 20,0 0,28 -20,0" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  </g>

  <!-- Silhouettes of Indian Platformer Elements -->
  <!-- Left: Elder Guru under Sal Tree -->
  <g transform="translate(140, 310)" opacity="0.85">
    <!-- Tree Trunk -->
    <rect x="-6" y="-110" width="12" height="110" fill="#1B0C04" />
    <circle cx="0" cy="-125" r="45" fill="#1C3818" />
    <!-- Guru Silhouette -->
    <circle cx="45" cy="-35" r="9" fill="#FFD54F" />
    <path d="M 38 -26 L 52 -26 L 48 0 L 42 0 Z" fill="#FFE082" />
    <line x1="56" y1="-40" x2="56" y2="0" stroke="#FFD54F" stroke-width="2" />
  </g>

  <!-- Right: Adventurer Kabir Mid-Air Jump -->
  <g transform="translate(1040, 270)">
    <!-- Scarf Fluttering -->
    <path d="M -15 -18 Q -35 -28 -55 -16 Q -35 -10 -10 -12 Z" fill="#FF6D00" filter="url(#glowEffect)" />
    <!-- Torso -->
    <rect x="-10" y="-16" width="20" height="24" rx="4" fill="#00ACC1" />
    <!-- Head & Saffron Headband -->
    <circle cx="0" cy="-26" r="10" fill="#D7CCC8" />
    <rect x="-10" y="-28" width="20" height="4" fill="#FF6D00" />
    <!-- Legs Dynamic Pose -->
    <line x1="-6" y1="8" x2="-14" y2="24" stroke="#558B2F" stroke-width="4" stroke-linecap="round" />
    <line x1="6" y1="8" x2="16" y2="18" stroke="#558B2F" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Center Typography & Branding -->
  <g text-anchor="middle">
    <!-- Top Category Tag -->
    <rect x="420" y="24" width="360" height="30" rx="15" fill="#2E163B" stroke="#BA68C8" stroke-width="1.5" />
    <text x="600" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E1BEE7" letter-spacing="2.5">
      JHARKHAND QUEST • 2D PLATFORM ADVENTURE
    </text>

    <!-- Main Title -->
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#goldOrange)" filter="url(#glowEffect)" letter-spacing="3">
      SUPER MARIO BROS.
    </text>

    <!-- Subtitle (Original IP) -->
    <text x="600" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="4">
      RRR: REWIND • REIMAGINE • RECONNECT
    </text>

    <!-- Regional & Production Tagline -->
    <text x="600" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#B0BEC5" letter-spacing="1.5">
      8 Culturally Rooted Jharkhand Regions • Bollywood Cinematic Direction • Bilingual Engine
    </text>

    <!-- Creator Badge & Tech Badges -->
    <g transform="translate(600, 315)">
      <!-- Creator Badge -->
      <g transform="translate(-190, 0)">
        <rect x="-90" y="0" width="180" height="26" rx="13" fill="#BF360C" />
        <text x="0" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF">👑 RAJRANJEET7680</text>
      </g>
      <!-- Web Vertical Slice Badge -->
      <g transform="translate(0, 0)">
        <rect x="-90" y="0" width="180" height="26" rx="13" fill="#00838F" />
        <text x="0" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#E0F7FA">⚡ WEB VERTICAL SLICE</text>
      </g>
      <!-- Languages Badge -->
      <g transform="translate(190, 0)">
        <rect x="-90" y="0" width="180" height="26" rx="13" fill="#2E7D32" />
        <text x="0" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#E8F5E9">🇮🇳 ENGLISH + हिंदी</text>
      </g>
    </g>
  </g>
</svg>
